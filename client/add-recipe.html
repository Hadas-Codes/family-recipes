<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הוספת מתכון - המתכונים שלי</title>
  <link rel="icon" href="favicon.ico.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="hero-text">
        <p class="subtitle">ספר המתכונים המשפחתי שלנו</p>
        <h1>הוספת מתכון חדש</h1>
      </div>
      <nav>
        <ul>
          <li class="dropdown">
            <a href="recipes.html">קטגוריות ▾</a>
            <div class="dropdown-content">
              <a href="recipes.html?category=cakes" onclick="filterCategory('cakes')">עוגות</a>
              <a href="recipes.html?category=cookies" onclick="filterCategory('cookies')">עוגיות</a>
              <a href="recipes.html?category=pastries" onclick="filterCategory('pastries')">מאפים</a>
              <a href="recipes.html?category=food" onclick="filterCategory('food')">אוכל</a>
              <a href="recipes.html?category=desserts" onclick="filterCategory('desserts')">קינוחים</a>
              <a href="recipes.html" onclick="filterCategory('')">הכל</a>
            </div>
          </li>
          <li><a href="recipes.html">מתכונים</a></li>
          <li><a href="about.html">אודות</a></li>
          <li><a href="index.html">ראשי</a></li>
        </ul>
        <input type="text" id="recipe-search" placeholder="חפש מתכון לפי שם..." class="search-input">
      </nav>
    </div>
  </header>

  <main>
    <form id="add-recipe-form">
      <div>
        <label>שם המתכון</label>
        <input type="text" id="title" required>
      </div>
     <div>
        <label>קטגוריה</label>
        <select id="category" required>
          <option value="cakes">עוגות</option>
          <option value="cookies">עוגיות</option>
          <option value="pastries">מאפים</option>
          <option value="food">אוכל</option>
          <option value="desserts">קינוחים</option>
        </select>
      </div>
      <div>
        <label>תיאור קצר</label>
        <input type="text" id="description">
      </div>
      <div>
        <label>מצרכים</label>
        <textarea id="ingredients" rows="4" required></textarea>
      </div>
      <div>
        <label>אופן הכנה</label>
        <textarea id="instructions" rows="4" required></textarea>
      </div>
      <div>
        <label>העלאת תמונה</label>
        <input type="file" id="image" accept="image/*">
      </div>
      <button type="submit">שמור מתכון</button>
    </form>
  </main>

  <footer>
    <p>משפחת אלבז מימון מלכה | להזמנות פרטיות: 050-411-9222 | מייל: orders@bakery.co.il</p>
    <p>&copy; 2026 כל הזכויות שמורות</p>
  </footer>

  <script src="js/add-recipe.js"></script>
</body>
</html>
